apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: landing
  name: landing
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: landing
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: landing
    spec:
      containers:
      - image: ghcr.io/robosell-organization/landing:main
        imagePullPolicy: Always
        name: landing
        env:
        # k8s HOSTNAME'ga pod nomini yozadi — Next standalone server.js shunda faqat pod IP'sida tinglaydi
        # va proxy.ts rewrite'lari (localhost orqali) uzilib qoladi. Shu sabab aniq beriladi.
        - name: HOSTNAME
          value: "0.0.0.0"
        - name: PORT
          value: "3000"
        ports:
        - containerPort: 3000
          protocol: TCP
        readinessProbe:
          # Trafik faqat server javob bera boshlagach yuboriladi (rolling update'da 502 bo'lmasligi uchun).
          # /robots.txt — kichik javob, proxy.ts unga tegmaydi (redirect yo'q, har doim 200)
          httpGet:
            path: /robots.txt
            port: 3000
          initialDelaySeconds: 3
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          # Server qotib qolsa (~1 daqiqa javobsiz) — pod qayta ishga tushiriladi
          httpGet:
            path: /robots.txt
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 3
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: github-registry
      restartPolicy: Always

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: doks.digitalocean.com/node-pool
                operator: In
                values:
                - "production"
---

apiVersion: v1
kind: Service
metadata:
  name: landing
  namespace: production
spec:
  ports:
  - port: 80
    protocol: TCP
    targetPort: 3000
  selector:
    app: landing

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
  labels:
    app.kubernetes.io/name: landing
  name: landing-ingress
  namespace: production
spec:
  ingressClassName: nginx-v2
  rules:
  - host: temp.robosell.uz
    http:
      paths:
      - backend:
          service:
            name: landing
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - temp.robosell.uz
    secretName: temp.robosell.uz-tls

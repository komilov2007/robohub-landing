apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: landing
  name: landing
  namespace: production
spec:
  replicas: 4
  selector:
    matchLabels:
      app: landing
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: landing
    spec:
      containers:
      - image: ghcr.io/robosell-organization/landing:main
        imagePullPolicy: Always
        name: landing
        ports:
        - containerPort: 80
          protocol: TCP
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: github-registry
      restartPolicy: Always

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: doks.digitalocean.com/node-pool
                operator: In
                values:
                - "production"
---

apiVersion: v1
kind: Service
metadata:
  name: landing
  namespace: production
spec:
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80
  selector:
    app: landing

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
  labels:
    app.kubernetes.io/name: landing
  name: landing-ingress
  namespace: production
spec:
  ingressClassName: nginx
  rules:
  - host: bitomarket.uz
    http:
      paths:
      - backend:
          service:
            name: landing
            port:
              number: 80
        path: /
        pathType: Prefix
  - host: esell.era.uz
    http:
      paths:
      - backend:
          service:
            name: landing
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - bitomarket.uz
    secretName: bitomarket.uz-tls
  - hosts:
    - esell.era.uz
    secretName: esell.era.uz-tls

---
